<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Sweet Pillow Dreams</title>
    <style>
        :root {
            --bg: #fbf6ed;
            --bg-soft: rgba(255, 253, 248, 0.9);
            --line: rgba(24, 35, 47, 0.08);
            --text: #172333;
            --muted: #5d6b7c;
            --accent: #16b8aa;
            --accent-2: #ffbd62;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --bg: #08151d;
            --bg-soft: rgba(13, 33, 43, 0.9);
            --line: rgba(164, 228, 221, 0.16);
            --text: #f3ffff;
            --muted: #b9d5d8;
            --accent: #45dfce;
            --accent-2: #ffd27f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "SF Pro Display", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, color-mix(in srgb, var(--accent-2) 22%, transparent), transparent 28%),
                radial-gradient(circle at 85% 15%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 26%),
                linear-gradient(180deg, color-mix(in srgb, var(--bg) 92%, white), var(--bg));
        }

        .language-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 54px;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--text);
            background: var(--bg-soft);
            font-weight: 900;
            cursor: pointer;
        }

        .panel {
            width: min(100%, 720px);
            padding: 42px 34px;
            border-radius: 32px;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0)), var(--bg-soft);
            border: 1px solid var(--line);
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.18);
            text-align: center;
            backdrop-filter: blur(18px);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--accent) 10%, transparent);
            color: var(--muted);
            font-size: 0.95rem;
            font-weight: 800;
        }

        .badge-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 18px color-mix(in srgb, var(--accent-2) 70%, transparent);
        }

        .error-code {
            margin-top: 16px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.1em;
        }

        h1 {
            margin: 16px 0 14px;
            font-size: clamp(2.2rem, 6vw, 4rem);
            line-height: 0.96;
            letter-spacing: -0.05em;
        }

        p {
            margin: 0 auto;
            max-width: 540px;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.65;
        }

        .divider {
            width: 100%;
            height: 1px;
            margin: 30px 0 22px;
            background: linear-gradient(90deg, transparent, var(--line), transparent);
        }

        .action-link {
            display: inline-block;
            margin-top: 10px;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <button class="language-toggle" id="languageToggle">RU</button>

    <main class="panel">
        <div class="badge">
            <span class="badge-dot"></span>
            Sweet Pillow Dreams
        </div>

        <div class="error-code">{{ status_code }}</div>

        <h1 id="errorTitle">{{ title }}</h1>
        <p id="errorMessage">{{ message }}</p>

        <div class="divider"></div>

        <a href="/catalog" class="action-link" id="errorLink">
            Вернуться в каталог
        </a>
    </main>

    <script src="/catalog/i18n.js"></script>
    <script>
        const theme = localStorage.getItem('spd-theme') || localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;

        function applyLang() {
            const lang = window.SPD_I18N?.getLang?.() || localStorage.getItem('spd-lang') || 'ru';

            if (lang === 'uz') {
                document.documentElement.lang = 'uz';
                document.getElementById('languageToggle').textContent = 'OZ';
                document.getElementById('errorTitle').textContent = 'Sahifa topilmadi';
                document.getElementById('errorMessage').textContent =
                    'Bu sahifani topa olmadik. Havola eskirgan yoki mahsulot katalogdan olib tashlangan bo‘lishi mumkin.';
                document.getElementById('errorLink').textContent = 'Katalogga qaytish';
            } else {
                document.documentElement.lang = 'ru';
                document.getElementById('languageToggle').textContent = 'RU';
            }
        }

        document.getElementById('languageToggle').onclick = () => {
            localStorage.setItem('spd-lang',
                (localStorage.getItem('spd-lang') || 'ru') === 'ru' ? 'uz' : 'ru'
            );
            applyLang();
        };

        applyLang();
    </script>
</body>
</html>
